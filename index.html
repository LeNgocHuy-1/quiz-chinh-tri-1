<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn thi Chính trị – 164 câu trắc nghiệm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ecf5;--panel:#fff;--ink:#0f1b33;--mute:#5d6b86;--line:#d3dbe9;--blue:#2347d6;--blueS:#e4eaff;--ok:#0d9467;--okS:#d9f5ea;--bad:#d62f3b;--badS:#fde4e6;--gold:#f5b800;--sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Source Serif 4",Georgia,"Times New Roman",serif}
body.dark{--bg:#0b1120;--panel:#141c31;--ink:#e9eefb;--mute:#93a2c4;--line:#27324f;--blue:#7b93ff;--blueS:#1d2850;--ok:#3ed39b;--okS:#10382d;--bad:#ff6b76;--badS:#40181d}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--blue);display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:7px}
.logo i{border-radius:50%;border:2px solid #fff}.logo i:first-child{background:#fff}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.panel{background:var(--panel);border-radius:22px;padding:22px;margin-bottom:14px;border:1px solid var(--line)}
.btn{border:1.5px solid var(--line);background:var(--panel);padding:11px 18px;border-radius:999px;cursor:pointer;font-weight:600;transition:transform .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--blue)}.btn:active:not(:disabled){transform:scale(.97)}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}
body.dark .btn.main{color:#0b1120}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.sm{padding:6px 13px;font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.mute{color:var(--mute);font-size:.92rem}
/* hero */
.hero{padding:8px 4px 20px}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,7vw,3rem);line-height:1.1;margin:14px 0 8px;letter-spacing:-.02em}
.sheet{display:flex;gap:12px}
.sheet b{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:1rem;position:relative;overflow:hidden}
.sheet b::before{content:"";position:absolute;inset:0;background:var(--blue);transform:scale(0);border-radius:50%}
.sheet b span{position:relative}
.sheet b:nth-child(3){border-color:var(--blue);color:#fff;animation:none}
.sheet b:nth-child(3)::before{animation:fill .5s .5s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes fill{to{transform:scale(1)}}
h2{font-size:1.02rem;margin:0 0 12px;font-weight:700}
/* settings */
.sw{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw i{flex:0 0 44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.18s;margin-top:2px}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s}
.sw input:checked+i{background:var(--blue)}.sw input:checked+i::after{left:21px}
.sw input:focus-visible+i{outline:3px solid var(--blue);outline-offset:2px}
.sw b{display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;gap:4px;margin:6px 0 4px}
.seg label{text-align:center;padding:9px 6px;border-radius:11px;cursor:pointer;font-weight:600}
.seg input{position:absolute;opacity:0}
.seg input:checked+span{background:var(--panel);box-shadow:0 1px 4px rgba(15,27,51,.18);color:var(--blue)}
.seg span{display:block;padding:9px 6px;border-radius:11px;margin:-9px -6px}
.seg small{display:block;font-weight:400;color:var(--mute);font-size:.78rem}
.chips{display:grid;gap:8px}
.chip{position:relative;cursor:pointer;display:block}
.chip input{position:absolute;opacity:0}
.chip span{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);font-weight:500}
.chip em{font-style:normal;color:var(--mute);font-size:.88rem;white-space:nowrap}
.chip input:checked+span{border-color:var(--blue);background:var(--blueS)}
.chip input:focus-visible+span{outline:3px solid var(--blue)}
.num{width:84px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel)}
/* quiz */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qn{font-weight:800;font-size:1.05rem}.qn small{color:var(--mute);font-weight:500}
.part{font-size:.82rem;color:var(--mute);text-align:right}
.prog{height:6px;border-radius:9px;background:var(--line);margin:12px 0 22px;overflow:hidden}
.prog div{height:100%;background:var(--blue);border-radius:9px;transition:width .3s}
.qtext{font-family:var(--serif);font-size:clamp(1.25rem,4.4vw,1.55rem);font-weight:600;line-height:1.4;margin:0 0 20px;text-wrap:pretty}
.ch{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:14px 6px;cursor:pointer;border-radius:0;transition:background .12s}
.ch:last-of-type{border-bottom:1px solid var(--line)}
.ch:hover:not(.lock){background:var(--blueS)}
.ch .b{flex:0 0 38px;height:38px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;transition:.15s}
.ch.sel .b{background:var(--blue);border-color:var(--blue);color:#fff}
.ch.right{background:var(--okS)}.ch.right .b{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{background:var(--badS)}.ch.wrong .b{background:var(--bad);border-color:var(--bad);color:#fff}
body.dark .ch.sel .b,body.dark .ch.right .b,body.dark .ch.wrong .b{color:#0b1120}
.ch.lock{cursor:default}
.fb{margin:14px 0 0;padding:11px 14px;border-radius:14px;font-weight:600}
.fb.ok{background:var(--okS);color:var(--ok)}.fb.no{background:var(--badS);color:var(--bad)}
.nav{display:flex;justify-content:space-between;margin-top:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid button{height:36px;border-radius:10px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-size:.85rem;font-weight:600}
.grid .done{background:var(--blueS);border-color:var(--blue)}
.grid .ok{background:var(--okS);border-color:var(--ok)}.grid .bad{background:var(--badS);border-color:var(--bad)}
.grid .cur{outline:2.5px solid var(--ink);outline-offset:1px}
/* result */
.ring{width:190px;height:190px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center}
.ring div{width:150px;height:150px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;font-family:var(--serif);font-size:2.4rem;font-weight:600;line-height:1.1}
.ring small{display:block;font-family:var(--sans);font-size:.85rem;color:var(--mute);font-weight:500}
.rev{border-top:1px solid var(--line);padding:14px 0}
.rev p{margin:4px 0}.g{color:var(--ok);font-weight:600}.r{color:var(--bad);font-weight:600}
.center{text-align:center}
footer{text-align:center;color:var(--mute);font-size:.8rem;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.sheet b:nth-child(3)::before{transform:scale(1)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div class="brand"><span class="logo"><i></i><i></i><i></i><i></i></span>Ôn thi Chính trị</div>
    <button class="icon" id="themeBtn" aria-label="Đổi giao diện sáng/tối">🌙</button></div>
  <main id="app"></main>
  <footer>Phím tắt: A–D hoặc 1–4 để chọn • ← → để chuyển câu</footer>
</div>
<script>
const DATA = [{"id": 1, "q": "Chủ nghĩa Mác - Lênin ra đời vào khoảng thời gian nào?", "part": "PHẦN I: TRIẾT HỌC MÁC – LÊNIN", "opts": {"A": "Đầu thế kỷ 19", "B": "Cuối thế kỷ 18", "C": "Giữa thế kỷ 19", "D": "Đầu thế kỷ 20"}, "ans": "C"}, {"id": 2, "q": "Ai là người sáng lập chủ nghĩa Mác - Lênin?", "part": "PHẦN I: TRIẾT HỌC MÁC – LÊNIN", "opts": {"A": "Karl Marx và Friedrich Engels", "B": "Karl Marx và V.I. Lenin", "C": "Friedrich Engels và V.I. Lenin", "D": "Karl Marx"}, "ans": "A"}, {"id": 3, "q": "Vật chất trong triết học Mác - Lênin được hiểu là gì?", "part": "PHẦN I: TRIẾT HỌC MÁC – LÊNIN", "opts": {"A": "Tất cả những gì tồn tại trong thực tế khách quan", "B": "Những thứ có thể nhìn thấy và cảm nhận", "C": "Những hiện tượng tự nhiên", "D": "Các yếu tố cấu thành vũ trụ"}, "ans": "A"}, {"id": 4, "q": "Khái niệm cơ bản trong triết học Mác - Lênin là gì?", "part": "PHẦN I: TRIẾT HỌC MÁC – LÊNIN", "opts": {"A": "Vật chất và ý thức", "B": "Nguyên tử và phân tử", "C": "Tâm lý và sinh lý", "D": "Kinh tế và chính trị"}, "ans": "A"}, {"id": 5, "q": "Triết học Mác - Lênin cho rằng, ý thức là gì?", "part": "PHẦN I: TRIẾT HỌC MÁC – LÊNIN", "opts": {"A": "Một dạng vật chất", "B": "Một sản phẩm của não người", "C": "Một hiện tượng tự nhiên", "D": "Một sản phẩm của xã hội"}, "ans": "D"}, {"id": 6, "q": "Theo triết học Mác - Lênin, mối quan hệ giữa vật chất và ý thức là gì?", "part": "PHẦN I: TRIẾT HỌC MÁC – LÊNIN", "opts": {"A": "Vật chất quyết định ý thức", "B": "Ý thức quyết định vật chất", "C": "Cả hai tác động lẫn nhau", "D": "Không có mối quan hệ"}, "ans": "A"}, {"id": 7, "q": "Vật chất là tất cả những gì tồn tại như thế nào?", "part": "PHẦN I: TRIẾT HỌC MÁC – LÊNIN", "opts": {"A": "Thực tại khách quan", "B": "Thực tế khách quan", "C": "Hiện thực khách quan", "D": "Tồn tại khách quan"}, "ans": "D"}, {"id": 8, "q": "Tờ đề thi em đang cầm trên tay thuộc phạm trù nào?", "part": "PHẦN I: TRIẾT HỌC MÁC – LÊNIN", "opts": {"A": "Vật thể", "B": "Vừa là vật thể vừa là vật chất (từ 1000%/năm)", "D": "3 đến 4 con số"}, "ans": "B"}, {"id": 49, "q": "Anh A mua 1 chiếc điện thoại mới. Chưa kịp bóc tem thì thị trường ra mắt thế hệ mới hiện đại hơn làm giá máy cũ giảm. Chiếc điện thoại anh A đang bị giảm giá trị do:", "part": "PHẦN II: KINH TẾ CHÍNH TRỊ MÁC – LÊNIN", "opts": {"A": "Hao mòn hữu hình", "B": "Biến dạng vật chất", "C": "Hao mòn tự nhiên", "D": "Hao mòn vô hình"}, "ans": "D"}, {"id": 50, "q": "Tư bản khả biến (bộ phận tư bản dùng để mua sức lao động) được ký hiệu là gì?", "part": "PHẦN II: KINH TẾ CHÍNH TRỊ MÁC – LÊNIN", "opts": {"A": "m", "B": "v", "C": "c", "D": "M"}, "ans": "B"}, {"id": 51, "q": "Trong phương pháp sản xuất giá trị thặng dư tương đối, để rút ngắn thời gian lao động tất yếu thì biện pháp cốt lõi là:", "part": "PHẦN II: KINH TẾ CHÍNH TRỊ MÁC – LÊNIN", "opts": {"A": "Tăng cường độ lao động", "B": "Tăng năng suất lao động xã hội (nhất là ở các ngành sản xuất tư liệu tiêu dùng)", "C": "Cắt giảm tiền lương công nhân", "D": "Tăng thời gian lao động"}, "ans": "B"}, {"id": 52, "q": "Thời gian người lao động làm việc tạo ra lượng giá trị ngang bằng với giá trị sức lao động của mình gọi là thời gian:", "part": "PHẦN II: KINH TẾ CHÍNH TRỊ MÁC – LÊNIN", "opts": {"A": "Lao động tất yếu", "B": "Lao động thặng dư", "C": "Lao động cá biệt", "D": "Lao động xã hội"}, "ans": "A"}, {"id": 53, "q": "Điểm đặc biệt nhất của hàng hóa sức lao động so với hàng hóa thông thường khi đi vào sử dụng là có khả năng:", "part": "PHẦN II: KINH TẾ CHÍNH TRỊ MÁC – LÊNIN", "opts": {"A": "Đều mua bán dễ dàng", "B": "Tạo ra giá trị mới lớn hơn giá trị bản thân nó (tạo ra giá trị thặng dư)", "C": "Mang lại giá trị sử dụng cao", "D": "Có giá trị trao đổi lớn"}, "ans": "B"}, {"id": 54, "q": "Chủ nghĩa xã hội khoa học là gì?", "part": "PHẦN III: CHỦ NGHĨA XÃ HỘI KHOA HỌC", "opts": {"A": "Một lý thuyết về kinh tế đơn thuần", "B": "Một hệ thống triết học độc lập", "C": "Hệ thống lý luận về cách mạng xã hội chủ nghĩa và sự chuyển biến sang xã hội cộng sản", "D": "Một phương pháp nghiên cứu xã hội học"}, "ans": "C"}, {"id": 55, "q": "Chủ nghĩa xã hội khoa học hướng tới mục tiêu cuối cùng là gì?", "part": "PHẦN III: CHỦ NGHĨA XÃ HỘI KHOA HỌC", "opts": {"A": "Xóa bỏ mọi hình thức bóc lột", "B": "Thiết lập xã hội công bằng, tự do", "C": "Giải phóng con người, mang lại hạnh phúc cho nhân dân", "D": "Cả ba ý trên"}, "ans": "D"}, {"id": 56, "q": "Đặc trưng cơ bản về mặt kinh tế của chủ nghĩa xã hội là gì?", "part": "PHẦN III: CHỦ NGHĨA XÃ HỘI KHOA HỌC", "opts": {"A": "Thiết lập chế độ sở hữu công cộng (công hữu) về tư liệu sản xuất chủ yếu", "B": "Sản xuất tự phát theo thị trường", "C": "Phân phối theo vốn góp", "D": "Cả ba ý trên"}, "ans": "A"}, {"id": 57, "q": "Giai đoạn đầu (thấp) của hình thái kinh tế - xã hội cộng sản chủ nghĩa là gì?", "part": "PHẦN III: CHỦ NGHĨA XÃ HỘI KHOA HỌC", "opts": {"A": "Xã hội tư bản chủ nghĩa", "B": "Xã hội xã hội chủ nghĩa (Chủ nghĩa xã hội)", "C": "Xã hội cộng sản chủ nghĩa", "D": "Xã hội phong kiến"}, "ans": "B"}, {"id": 58, "q": "Quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa ở Việt Nam được hiểu là:", "part": "PHẦN III: CHỦ NGHĨA XÃ HỘI KHOA HỌC", "opts": {"A": "Bỏ qua toàn bộ lực lượng sản xuất của tư bản", "B": "Bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và kiến trúc thượng tầng tư bản chủ nghĩa", "C": "Bỏ qua việc phát triển kinh tế thị trường", "D": "Bỏ qua tiếp thu thành tựu khoa học - công nghệ"}, "ans": "B"}, {"id": 59, "q": "Xã hội xã hội chủ nghĩa mà nhân dân ta xây dựng theo Cương lĩnh bổ sung, phát triển năm 2011 bao gồm bao nhiêu đặc trưng tiêu biểu?", "part": "PHẦN III: CHỦ NGHĨA XÃ HỘI KHOA HỌC", "opts": {"A": "6 đặc trưng", "B": "7 đặc trưng", "C": "8 đặc trưng", "D": "9 đặc trưng"}, "ans": "C"}, {"id": 60, "q": "Việt Nam quá độ lên chủ nghĩa xã hội xuất phát từ điểm xuất phát lịch sử nào?", "part": "PHẦN III: CHỦ NGHĨA XÃ HỘI KHOA HỌC", "opts": {"A": "Từ một nước phong kiến thực dân lập", "B": "Từ một nước tư bản phát triển", "C": "Từ một nước thuộ const $=s=>document.querySelector(s), app=$('#app');
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const L=['A','B','C','D'], PARTS=[...new Set(DATA.map(q=>q.part))], pn=p=>p.replace(/^PHẦN\s+[IVX]+:\s*/i,'');
const pretty=s=>{const t=pn(s).toLowerCase();return t.charAt(0).toUpperCase()+t.slice(1)};
let st=Object.assign({parts:PARTS.slice(),shuffleQ:true,shuffleO:true,mode:'practice',count:0},LS.get('quiz_settings',{}));
if(!LS.get('quiz_v2',false)){PARTS.forEach(p=>{if(!st.parts.includes(p))st.parts.push(p)});LS.set('quiz_v2',true)}
let wrong=new Set(LS.get('quiz_wrong',[])), S=null;
const saveW=()=>LS.set('quiz_wrong',[...wrong]), saveS=()=>{if(S)LS.set('quiz_session',S)};

function build(qs){
  qs=st.shuffleQ?shuffle(qs):qs.slice().sort((a,b)=>a.id-b.id);
  return qs.map(q=>{let o=L.filter(k=>q.opts[k]!==undefined).map(k=>({k,t:q.opts[k]}));if(st.shuffleO)o=shuffle(o);return{id:q.id,q:q.q,part:q.part,opts:o,ans:q.ans}});
}
function start(qs,mode){
  if(!qs.length){alert('Chưa có câu hỏi nào để làm!');return}
  S={items:build(qs),answers:new Array(qs.length).fill(null),idx:0,mode:mode||st.mode,finished:false,src:qs.map(q=>q.id)};
  saveS();quiz();
}

function home(){
  S=null;
  const sv=LS.get('quiz_session',null), has=sv&&!sv.finished&&sv.items&&sv.items.length;
  const pool=DATA.filter(q=>st.parts.includes(q.part)).length, n=st.count>0?Math.min(st.count,pool):pool;
  app.innerHTML=`
  <div class="hero"><div class="sheet" aria-hidden="true">${L.map(x=>`<b><span>${x}</span></b>`).join('')}</div>
    <h1>Làm đúng ${DATA.length} câu, nhớ chắc từng phần.</h1>
    <p class="mute" style="margin:0">Xáo câu, xáo đáp án, sai đâu làm lại đó.</p></div>
  ${has?`<div class="panel"><h2>Bài đang làm dở</h2><p class="mute" style="margin:0 0 12px">Đã làm ${sv.answers.filter(a=>a!==null).length}/${sv.items.length} câu.</p>
    <div class="row"><button class="btn main" id="resume">Tiếp tục làm</button><button class="btn" id="drop">Bỏ bài này</button></div></div>`:''}
  <div class="panel"><h2>Cách làm bài</h2>
    <label class="sw"><input type="checkbox" id="shQ" ${st.shuffleQ?'checked':''}><i></i><span><b>Xáo thứ tự câu hỏi</b></span></label>
    <label class="sw"><input type="checkbox" id="shO" ${st.shuffleO?'checked':''}><i></i><span><b>Xáo thứ tự A/B/C/D</b><span class="mute">Nhớ nội dung, không nhớ vị trí đáp án.</span></span></label>
    <div class="seg">
      <label><input type="radio" name="mode" value="practice" ${st.mode==='practice'?'checked':''}><span>Luyện tập<small>Biết đúng sai ngay</small></span></label>
      <label><input type="radio" name="mode" value="exam" ${st.mode==='exam'?'checked':''}><span>Thi thử<small>Chấm điểm cuối bài</small></span></label></div>
    <div class="row" style="margin-top:12px"><label for="cnt"><b>Số câu</b> <span class="mute">(0 = tất cả)</span></label><input class="num" type="number" id="cnt" min="0" max="${DATA.length}" value="${st.count||0}"></div></div>
  <div class="panel"><h2>Chọn phần muốn ôn</h2><div class="chips">
    ${PARTS.map((p,i)=>`<label class="chip"><input type="checkbox" class="pc" value="${i}" ${st.parts.includes(p)?'checked':''}><span>${esc(pretty(p))}<em>${DATA.filter(q=>q.part===p).length} câu</em></span></label>`).join('')}</div>
    <div class="row" style="margin-top:18px"><button class="btn main" id="go">Bắt đầu ${n} câu</button>
    <button class="btn" id="gw" ${wrong.size?'':'disabled'}>Ôn câu hay sai (${wrong.size})</button></div></div>
  <div class="mute center">Tiến độ lưu ngay trên trình duyệt này. <button class="btn sm" id="cw" ${wrong.size?'':'disabled'}>Xoá danh sách câu sai</button></div>`;
  if(has){$('#resume').onclick=()=>{S=sv;quiz()};$('#drop').onclick=()=>{LS.del('quiz_session');home()}}
  const read=()=>{st.shuffleQ=$('#shQ').checked;st.shuffleO=$('#shO').checked;st.mode=document.querySelector('input[name=mode]:checked').value;
    st.count=Math.max(0,Math.min(DATA.length,parseInt($('#cnt').value)||0));st.parts=[...document.querySelectorAll('.pc')].filter(c=>c.checked).map(c=>PARTS[+c.value]);LS.set('quiz_settings',st)};
  app.querySelectorAll('input').forEach(i=>i.onchange=()=>{read();home()});
  $('#go').onclick=()=>{read();let p=DATA.filter(q=>st.parts.includes(q.part));if(!p.length){alert('Hãy chọn ít nhất 1 phần.');return}
    if(st.count>0&&st.count<p.length)p=shuffle(p).slice(0,st.count);start(p)};
  $('#gw').onclick=()=>{read();start(DATA.filter(q=>wrong.has(q.id)))};
  $('#cw').onclick=()=>{if(confirm('Xoá toàn bộ danh sách câu sai?')){wrong.clear();saveW();home()}};
}

function quiz(){
  const it=S.items[S.idx],n=S.items.length,pk=S.answers[S.idx],prac=S.mode==='practice',lock=prac&&pk!==null,done=S.answers.filter(a=>a!==null).length;
  const ch=it.opts.map((o,i)=>{let c='ch';
    if(lock){c+=' lock';if(o.k===it.ans)c+=' right';else if(o.k===pk)c+=' wrong'}else if(pk===o.k)c+=' sel';
    const mark=lock?(o.k===it.ans?'✓':(o.k===pk?'✗':L[i])):L[i];
    return `<button class="${c}" data-k="${o.k}"><span class="b">${mark}</span><span>${esc(o.t)}</span></button>`}).join('');
  const nav=S.items.map((x,i)=>{const a=S.answers[i];let c=a!==null?(prac?(a===x.ans?'ok':'bad'):'done'):'';if(i===S.idx)c+=' cur';return `<button class="${c}" data-go="${i}" aria-label="Câu ${i+1}">${i+1}</button>`}).join('');
  app.innerHTML=`
  <div class="panel">
    <div class="top"><div class="qn">Câu ${S.idx+1}<small> / ${n}</small></div><div class="part">${esc(pretty(it.part))}</div></div>
    <div class="prog"><div style="width:${done/n*100}%"></div></div>
    <p class="qtext">${esc(it.q)}</p>${ch}
    ${lock?`<div class="fb ${pk===it.ans?'ok':'no'}">${pk===it.ans?'Chính xác!':'Chưa đúng. Đáp án đúng là '+L[it.opts.findIndex(o=>o.k===it.ans)]+'.'}</div>`:''}
    <div class="nav"><button class="btn" id="pv" ${S.idx===0?'disabled':''}>Câu trước</button>
    ${S.idx===n-1?'<button class="btn main" id="fin">Nộp bài</button>':'<button class="btn main" id="nx">Câu tiếp</button>'}</div></div>
  <div class="panel"><div class="row between" style="margin-bottom:12px"><h2 style="margin:0">Đã làm ${done}/${n}</h2>
    <span class="row"><button class="btn sm" id="fin2">Nộp bài</button><button class="btn sm" id="hm">Thoát</button></span></div><div class="grid">${nav}</div></div>`;
  app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>pick(b.dataset.k));
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.idx=+b.dataset.go;saveS();quiz()});
  $('#pv').onclick=()=>mv(-1);if($('#nx'))$('#nx').onclick=()=>mv(1);if($('#fin'))$('#fin').onclick=finish;$('#fin2').onclick=finish;
  $('#hm').onclick=()=>{if(confirm('Thoát về trang chính? Bài đang làm vẫn được lưu để tiếp tục.')){saveS();home()}};
}
function mv(d){const j=S.idx+d;if(j>=0&&j<S.items.length){S.idx=j;saveS();quiz();scrollTo({top:0})}}
function pick(k){
  if(S.mode==='practice'&&S.answers[S.idx]!==null)return;
  S.answers[S.idx]=k;const it=S.items[S.idx];
  if(S.mode==='practice'){k!==it.ans?wrong.add(it.id):wrong.delete(it.id);saveW()}
  saveS();quiz();
}
function finish(){
  const left=S.answers.filter(a=>a===null).length;
  if(left&&!confirm(`Còn ${left} câu chưa làm (tính là sai). Vẫn nộp bài?`))return;
  S.finished=true;S.items.forEach((it,i)=>S.answers[i]===it.ans?wrong.delete(it.id):wrong.add(it.id));
  saveW();LS.del('quiz_session');result();
}
function result(){
  const n=S.items.length,ok=S.items.filter((it,i)=>S.answers[i]===it.ans).length,pct=Math.round(ok/n*100);
  const bad=S.items.map((it,i)=>({it,a:S.answers[i]})).filter(x=>x.a!==x.it.ans);
  const msg=pct>=90?'Xuất sắc, bạn nắm rất chắc!':pct>=70?'Khá tốt, ôn thêm vài câu là chắc.':pct>=50?'Mới qua nửa, cần ôn thêm.':'Chưa vững, làm lại các câu sai nhé.';
  app.innerHTML=`
  <div class="panel center"><div class="ring" style="background:conic-gradient(${pct>=70?'var(--ok)':pct>=50?'var(--gold)':'var(--bad)'} ${pct*3.6}deg,var(--line) 0)"><div><span>${ok}/${n}<small>${pct}% đúng</small></span></div></div>
    <p style="margin:0 0 16px;font-weight:600">${msg}</p>
    <div class="row" style="justify-content:center"><button class="btn main" id="ag">Làm lại, xáo mới</button>
    <button class="btn" id="aw" ${bad.length?'':'disabled'}>Làm lại câu sai (${bad.length})</button><button class="btn" id="hm">Trang chính</button></div></div>
  <div class="panel"><h2>Xem lại bài làm</h2>${bad.length?'':'<p class="g">Bạn đúng hết tất cả các câu!</p>'}
    ${bad.map(({it,a})=>{const r=it.opts.find(o=>o.k===it.ans),m=it.opts.find(o=>o.k===a);
    return `<div class="rev"><b>Câu ${it.id}.</b> ${esc(it.q)}<p class="r">Bạn chọn: ${m?esc(m.t):'(chưa trả lời)'}</p><p class="g">Đáp án đúng: ${esc(r.t)}</p></div>`}).join('')}</div>`;
  const by=ids=>DATA.filter(q=>ids.includes(q.id));
  $('#ag').onclick=()=>start(by(S.src),S.mode);$('#aw').onclick=()=>start(by(bad.map(x=>x.it.id)),S.mode);$('#hm').onclick=home;scrollTo({top:0});
}
document.addEventListener('keydown',e=>{
  if(!S||S.finished||!$('.qtext')||e.target.tagName==='INPUT')return;
  const it=S.items[S.idx];let i=L.indexOf(e.key.toUpperCase());if(i<0&&/^[1-4]$/.test(e.key))i=+e.key-1;
  if(i>=0&&i<it.opts.length){pick(it.opts[i].k);return}
  if(e.key==='ArrowRight')mv(1);if(e.key==='ArrowLeft')mv(-1);
});
function theme(d){document.body.classList.toggle('dark',d);$('#themeBtn').textContent=d?'☀️':'🌙'}
theme(LS.get('quiz_dark',!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)));
$('#themeBtn').onclick=()=>{const d=!document.body.classList.contains('dark');LS.set('quiz_dark',d);theme(d)};
home();
</script>
</body>
</html>
